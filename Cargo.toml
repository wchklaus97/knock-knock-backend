[package]
name = "knock-knock-worker"
version = "0.1.0"
edition = "2021"
description = "Rust/Cloudflare Worker backend for Knock Knock"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
bcrypt = { version = "0.19.3", default-features = false, features = ["alloc", "getrandom"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
hmac = "0.12"
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa", "pkcs8", "pem"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
worker = { version = "0.8.5", features = ["d1"] }
