name = "knock-knock-backend"
# Local development configuration only. Use wrangler.production.toml for a
# remote deploy; this file intentionally contains a local D1 binding.
main = "build/worker/shim.mjs"
compatibility_date = "2026-04-16"

[build]
command = "worker-build --release"

[vars]
NODE_ENV = "development"
PUSH_MODE = "dev"
CORS_ORIGIN = "*"
SERVICE_VERSION = "local-dev"
ACTION_PROVIDER_MODE = "internal"
ACTION_REMINDER_ENABLED = "true"
ACTION_MESSAGE_ENABLED = "true"
# Set these for real APNs delivery; secrets belong in `wrangler secret put`.
# PUSH_MODE = "both"
# APNS_BUNDLE_ID = "hk.knockknock.app"
# APNS_PRODUCTION = "true"

[[d1_databases]]
binding = "DB"
database_name = "knock-knock"
# Replace with the UUID returned by `wrangler d1 create knock-knock` before deploy.
database_id = "local"
migrations_dir = "migrations"
