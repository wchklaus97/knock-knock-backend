name: Production D1 backup

on:
  workflow_dispatch:
  schedule:
    - cron: "17 02 * * *"

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.KNOCK_KNOCK_CLOUDFLARE_ACCOUNT_ID }}
      BACKUP_BUCKET: ${{ vars.KNOCK_KNOCK_BACKUP_BUCKET }}
      BACKUP_PASSPHRASE: ${{ secrets.KNOCK_KNOCK_BACKUP_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Wrangler
        run: npm install --global wrangler@4.81.1
      - name: Verify backup prerequisites
        run: ./scripts/ci-prerequisites.sh backup
      - name: Materialize non-secret production config
        env:
          D1_DATABASE_ID: ${{ vars.KNOCK_KNOCK_D1_DATABASE_ID }}
          CORS_ORIGIN: ${{ vars.KNOCK_KNOCK_CORS_ORIGIN }}
        run: |
          test -n "$D1_DATABASE_ID"
          test -n "$CORS_ORIGIN"
          sed \
            -e "s|REPLACE_WITH_D1_DATABASE_ID|$D1_DATABASE_ID|g" \
            -e "s|REPLACE_WITH_ALLOWED_ORIGIN|$CORS_ORIGIN|g" \
            -e "s|REPLACE_WITH_RELEASE_VERSION|backup-${GITHUB_RUN_ID}|g" \
            wrangler.production.toml.example > "$RUNNER_TEMP/wrangler.production.toml"
      - name: Export production D1
        env:
          KNOCK_KNOCK_PRODUCTION_CONFIG: ${{ runner.temp }}/wrangler.production.toml
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$BACKUP_BUCKET"
          test -n "$BACKUP_PASSPHRASE"
          backup_dir="$RUNNER_TEMP/knock-knock-backup"
          mkdir -p "$backup_dir"
          plain="$backup_dir/knock-knock-${GITHUB_RUN_ID}.sql"
          encrypted="$backup_dir/knock-knock-${GITHUB_RUN_ID}.sql.gpg"
          ./scripts/export-production-d1.sh "$plain"
          test -s "$plain"
          grep -q "CREATE TABLE" "$plain"
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 \
            --output "$encrypted" "$plain"
          shred -u "$plain"
          object_key="backups/d1/knock-knock-${GITHUB_RUN_ID}.sql.gpg"
          wrangler r2 object put "$BACKUP_BUCKET/$object_key" \
            --config "$KNOCK_KNOCK_PRODUCTION_CONFIG" \
            --remote --file "$encrypted" --content-type application/octet-stream --force
          downloaded="$backup_dir/roundtrip.sql.gpg"
          restored="$backup_dir/roundtrip.sql"
          wrangler r2 object get "$BACKUP_BUCKET/$object_key" \
            --config "$KNOCK_KNOCK_PRODUCTION_CONFIG" \
            --remote --file "$downloaded"
          cmp "$encrypted" "$downloaded"
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --decrypt --output "$restored" "$downloaded"
          test -s "$restored"
          grep -q "CREATE TABLE" "$restored"
          sha256sum "$encrypted" | awk '{print $1}' > "$backup_dir/ciphertext.sha256"
          wrangler r2 object put "$BACKUP_BUCKET/${object_key}.sha256" \
            --config "$KNOCK_KNOCK_PRODUCTION_CONFIG" \
            --remote --file "$backup_dir/ciphertext.sha256" --content-type text/plain --force
          shred -u "$restored" "$downloaded" "$encrypted" "$backup_dir/ciphertext.sha256"
          echo "encrypted production D1 backup round-trip restore verification passed"
