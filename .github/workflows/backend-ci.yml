name: Rust backend CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --all-targets
      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Check Worker target
        run: cargo check --target wasm32-unknown-unknown
      - name: Run architecture and release preflight
        run: ./scripts/phase45-release-gate.sh

  dynamic-local-smoke:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain for Worker build
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install pinned worker-build
        run: cargo install worker-build --version 0.8.3 --locked
      - name: Install dynamic smoke dependencies
        run: |
          command -v curl
          command -v jq
          command -v python3
          npm install --global wrangler@4.81.1
      - name: Run isolated contract, R2, and provider gates
        run: |
          ./scripts/local-contract-gate.sh
          ./scripts/provider-local-gate.sh
